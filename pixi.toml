# A standalone C++ `auto` gate.

# The `check` mode (used by the CI gate) is stdlib-only, so it needs no native
# packages. `libclang` (the pypi libclang binding) is required only by the
# local `rewrite` mode: it provides `clang.cindex` and self-bundles its native
# library, so no conda native `libclang` is needed alongside it. It is pinned to
# 18.x to match the locally-verified binding.

[workspace]
name = "contract-auto-rewrite"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
libclang = ">=18.1.1, <19"

[tasks]
self-test = "python auto-rewrite.py self-test"
check = "python auto-rewrite.py check"
rewrite = "python auto-rewrite.py rewrite"
